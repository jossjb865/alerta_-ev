name: thestatsapi-ht-scan

on:
  schedule:
    - cron: "0 */2 * * *"    # cada 2 horas (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scanner HT + EV+ + Top 10 Telegram
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python thestatsapi_scan.py

      - name: Publicar resultados (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ht-scan-results-${{ github.run_number }}
          path: |
            ht_metrics_today.csv
            ht_value_scan_resumen.csv
            ht_value_alertas.csv
            ht_over05_top10.csv
          retention-days: 30

      - name: Guardar CSVs en el repositorio
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results
          cp ht_metrics_today.csv ht_value_scan_resumen.csv ht_value_alertas.csv ht_over05_top10.csv results/ 2>/dev/null || true
          git add results/*.csv
          git diff --cached --quiet || git commit -m "scan HT $(date -u +%F)"
          git push
