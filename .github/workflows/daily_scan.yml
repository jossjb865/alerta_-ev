name: thestatsapi-ht-scan

on:
  schedule:
    # Cada 4 horas, 30 min antes de la hora objetivo
    # 07:30 UTC -> partidos que comienzan a las 08:00
    - cron: "30 7 * * *"
    # 11:30 UTC -> partidos que comienzan a las 12:00
    - cron: "30 11 * * *"
    # 15:30 UTC -> partidos que comienzan a las 16:00
    - cron: "30 15 * * *"
    # 19:30 UTC -> partidos que comienzan a las 20:00
    - cron: "30 19 * * *"
    # 23:30 UTC -> partidos que comienzan a las 00:00 (día siguiente)
    - cron: "30 23 * * *"

  workflow_dispatch:
    inputs:
      target_start_hour:
        description: "Hora UTC de inicio del partido a analizar (8, 12, 16, 20, 0)"
        required: false
        default: "8"
        type: choice
        options: ["8", "12", "16", "20", "0"]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Resolver hora objetivo
        id: target
        shell: bash
        run: |
          TARGET="${{ github.event.inputs.target_start_hour || '' }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date -u +%H)
            case "$HOUR" in
              07) TARGET="8" ;;
              11) TARGET="12" ;;
              15) TARGET="16" ;;
              19) TARGET="20" ;;
              23) TARGET="0" ;;
              *) TARGET="8" ;;
            esac
          fi
          if [ -z "$TARGET" ]; then
            TARGET="8"
          fi
          echo "target_start_hour=$TARGET" >> "$GITHUB_OUTPUT"
          echo "HORA OBJETIVO: $TARGET UTC"

      - name: Ejecutar scanner HT + EV+
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_START_HOUR: ${{ steps.target.outputs.target_start_hour }}
        run: python thestatsapi_scan.py

      - name: Publicar resultados (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ht-scan-results-${{ steps.target.outputs.target_start_hour }}-${{ github.run_number }}
          path: |
            ht_metrics_today.csv
            ht_value_scan_resumen.csv
            ht_value_alertas.csv
          retention-days: 30

      - name: Guardar CSVs en el repositorio
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results
          cp ht_metrics_today.csv ht_value_scan_resumen.csv ht_value_alertas.csv results/ 2>/dev/null || true
          git add results/*.csv
          git diff --cached --quiet || git commit -m "scan HT $(date -u +%F) @${{ steps.target.outputs.target_start_hour }}h"
          git push
